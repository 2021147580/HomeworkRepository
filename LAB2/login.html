<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>로그인</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>

  <h1>Welcome to <span class="highlight">INTERNET-PROGRAMMING MOVIE SITE</span></h1>
  <p>
    <a href="login.html" class="link">로그인</a> |
    <a href="signup.html" class="link">회원가입</a>
  </p>

  <form action="#" method="post">
    <div class="form-group">
      <label for="userid">아이디:</label>
      <input type="text" id="userid" name="userid" placeholder="아이디 입력" required><br><br>
    </div>

    <div class="form-group">
      <label for="password">비밀번호:</label>
      <input type="password" id="password" name="password" placeholder="비밀번호 입력" required><br><br>
    </div>

    <button type="submit" class="signup">Login</button>
    <button type="reset" class="cancel">Cancel</button>
  </form>
</body>
</html>
